openapi: 3.0.0
info:
  title: Service Envelope API v2.0
  version: 2.0.2
  description: REST API for the Service Envelope System. Updated for unified delivery selection flow where POST /api/delivery/{requestId}/details is the canonical method+details endpoint and may auto-resume orchestrator when delivery is pending external.
  contact:
    name: Service Envelope Team
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: Development
  - url: https://api.mapua.edu.ph
    description: Production

paths:
  /health:
    get:
      tags: [System]
      summary: Health Check
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /api:
    get:
      tags: [System]
      summary: API Information
      operationId: getApiInfo
      security: []
      responses:
        '200':
          description: API metadata and key endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Service Envelope API
                  version:
                    type: string
                    example: 1.0.0
                  endpoints:
                    type: array
                    items:
                      type: string

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              requester:
                value:
                  email: requester@mapua.edu.ph
                  password: requester123
              approver:
                value:
                  email: approver@mapua.edu.ph
                  password: approver123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/verify:
    post:
      tags: [Auth]
      summary: Verify JWT Token
      operationId: verifyToken
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Bearer token. Route reads token from Authorization header.
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  user:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/services:
    get:
      tags: [Services]
      summary: List All Services
      operationId: listAllServices
      security: []
      responses:
        '200':
          description: All available services
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 4
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceSummary'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/services/ids:
    get:
      tags: [Services]
      summary: Get Service IDs Quick Reference
      operationId: getServiceIds
      security: []
      responses:
        '200':
          description: ID/name mapping and list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  serviceMap:
                    type: object
                    additionalProperties:
                      type: string
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        serviceId:
                          type: string
                        id:
                          type: string
                        name:
                          type: string
        '500':
          $ref: '#/components/responses/ServerError'

  /api/services/{serviceId}:
    get:
      tags: [Services]
      summary: Get Service Details
      operationId: getServiceDetails
      security: []
      parameters:
        - $ref: '#/components/parameters/ServiceIdParam'
      responses:
        '200':
          description: Service definition details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDefinitionDetails'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Services]
      summary: Delete Service
      operationId: deleteService
      security: []
      parameters:
        - $ref: '#/components/parameters/ServiceIdParam'
      responses:
        '200':
          description: Service deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  serviceId:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/requests:
    get:
      tags: [Requests]
      summary: List All Requests
      operationId: listAllRequests
      security: []
      parameters:
        - $ref: '#/components/parameters/StatusQueryParam'
        - $ref: '#/components/parameters/TypeQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
        - $ref: '#/components/parameters/OffsetQueryParam'
      responses:
        '200':
          description: List of requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestListResponse'

    post:
      tags: [Requests]
      summary: Create Request
      operationId: createRequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCreatePayload'
            examples:
              usingServiceId:
                value:
                  serviceId: SERVICE-999
                  initiator: requester@mapua.edu.ph
                  parameters:
                    studentId: 20250001
                    firstName: Juan
                    lastName: Dela Cruz
                    email: juan.delacruz@mapua.edu.ph
              usingType:
                value:
                  type: comprehensive-student-document
                  initiator: requester@mapua.edu.ph
                  parameters:
                    studentId: 20250001
                    firstName: Juan
                    lastName: Dela Cruz
                    email: juan.delacruz@mapua.edu.ph
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/requests/{requestId}:
    get:
      tags: [Requests]
      summary: Get Request Details
      operationId: getRequestDetails
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetailsResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Requests]
      summary: Cancel Request
      operationId: cancelRequest
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      responses:
        '200':
          description: Request cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    example: REQ-20260606-042
                  status:
                    type: string
                    example: cancelled
                  message:
                    type: string
                    example: Request cancelled successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /api/requests/{requestId}/resume:
    post:
      tags: [Requests]
      summary: Resume Request
      operationId: resumeRequest
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Request resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  message:
                    type: string
                  status:
                    type: string
                    example: processing
        '404':
          $ref: '#/components/responses/NotFound'

  /api/requests/{requestId}/history:
    get:
      tags: [Requests]
      summary: Get Request History
      operationId: getRequestHistory
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      responses:
        '200':
          description: Request history
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  history:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  totalEntries:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'

  /api/approvals/admin/tokens/{requestId}:
    get:
      tags: [Approvals]
      summary: Get Approval Tokens (Approvals Admin)
      operationId: getApprovalTokensByRequestInApprovalsRoute
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      responses:
        '200':
          description: Tokens for request
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  count:
                    type: integer
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApprovalTokenInfo'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/approvals/{token}:
    get:
      tags: [Approvals]
      summary: Check Approval Token Status
      operationId: checkApprovalTokenStatus
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenParam'
      responses:
        '200':
          description: Token status
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  requestId:
                    type: string
                  approverId:
                    type: string
                  used:
                    type: boolean
                  expired:
                    type: boolean
                  expiresAt:
                    type: string
                    format: date-time
                  createdAt:
                    type: string
                    format: date-time
        '404':
          $ref: '#/components/responses/NotFound'

  /api/approvals/{token}/approve:
    post:
      tags: [Approvals]
      summary: Approve Request by Token
      operationId: approveRequest
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  example: Approved by registrar.
      responses:
        '200':
          description: Approval processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  status:
                    type: string
                    example: approved
                  message:
                    type: string
                  approvalComplete:
                    type: boolean
                  rule:
                    type: string
                  nextStatus:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Approval stage already finalized

  /api/approvals/{token}/deny:
    post:
      tags: [Approvals]
      summary: Deny Request by Token
      operationId: denyRequest
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  example: Missing required supporting document.
      responses:
        '200':
          description: Request cancelled after denial
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  status:
                    type: string
                    example: cancelled
                  message:
                    type: string
                  reason:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Approval stage already finalized

  /api/approvals/{token}/request:
    get:
      tags: [Approvals]
      summary: Get Request Details for Approval Token
      operationId: getApprovalTokenRequest
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenParam'
      responses:
        '200':
          description: Request details for approval UI
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/payments/{requestId}/complete:
    post:
      tags: [Payments]
      summary: Mark Payment Complete
      operationId: completePayment
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId, amount]
              properties:
                transactionId:
                  type: string
                  example: MAYA-TXN-20260606-001
                amount:
                  type: number
                  example: 350.00
                method:
                  type: string
                  example: maya
                reference:
                  type: string
                  example: PAY-REF-5566
                metadata:
                  type: object
            examples:
              maya:
                value:
                  transactionId: MAYA-TXN-20260606-001
                  amount: 350.00
                  method: maya
                  reference: PAY-REF-5566
      responses:
        '200':
          description: Payment marked complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  status:
                    type: string
                    example: completed
                  message:
                    type: string
                  transactionId:
                    type: string
                  nextStatus:
                    type: string
                    example: processing
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/payments/{requestId}/failed:
    post:
      tags: [Payments]
      summary: Mark Payment Failed
      operationId: failPayment
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  example: Payment gateway timeout.
                errorCode:
                  type: string
                  example: PG_TIMEOUT
                metadata:
                  type: object
      responses:
        '200':
          description: Payment marked failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
                  reason:
                    type: string
                  nextStatus:
                    type: string
                    example: pending_payment
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/payments/maya:
    post:
      tags: [Payments]
      summary: Maya Webhook (payments mount)
      operationId: mayaPaymentWebhookFromPaymentsMount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MayaWebhookPayload'
            examples:
              success:
                value:
                  requestReferenceNumber: REQ-20260606-042
                  transactionId: MAYA-TXN-20260606-001
                  status: SUCCESS
                  amount: 350
                  currency: PHP
              failed:
                value:
                  requestReferenceNumber: REQ-20260606-042
                  transactionId: MAYA-TXN-20260606-001
                  status: FAILURE
                  amount: 350
                  currency: PHP
      responses:
        '200':
          description: Webhook processed
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/webhooks/maya:
    post:
      tags: [Payments]
      summary: Maya Webhook (webhooks mount)
      operationId: mayaPaymentWebhookFromWebhooksMount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MayaWebhookPayload'
      responses:
        '200':
          description: Webhook processed
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/webhooks/{requestId}/complete:
    post:
      tags: [Payments]
      summary: Mark Payment Complete (webhooks mount alias)
      operationId: completePaymentFromWebhooksMount
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId, amount]
              properties:
                transactionId:
                  type: string
                  example: MAYA-TXN-20260606-001
                amount:
                  type: number
                  example: 350.00
                method:
                  type: string
                  example: maya
                reference:
                  type: string
                  example: PAY-REF-5566
                metadata:
                  type: object
      responses:
        '200':
          description: Payment marked complete
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/webhooks/{requestId}/failed:
    post:
      tags: [Payments]
      summary: Mark Payment Failed (webhooks mount alias)
      operationId: failPaymentFromWebhooksMount
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  example: Payment gateway timeout.
                errorCode:
                  type: string
                  example: PG_TIMEOUT
                metadata:
                  type: object
      responses:
        '200':
          description: Payment marked failed
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/feedback/token/{token}:
    get:
      tags: [Feedback]
      summary: Get Feedback Status by Token
      operationId: getFeedbackByToken
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenParam'
      responses:
        '200':
          description: Feedback status and data by token
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  token:
                    type: string
                  status:
                    type: string
                  feedbackLink:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  feedback:
                    type: object
                    additionalProperties: true
                  tokenStatus:
                    $ref: '#/components/schemas/FeedbackTokenStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Feedback token has expired

  /api/feedback/token/{token}/submit:
    post:
      tags: [Feedback]
      summary: Submit Feedback by Token
      operationId: submitFeedbackByToken
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ratings:
                  type: object
                  additionalProperties:
                    type: number
                    minimum: 1
                    maximum: 5
                comments:
                  type: string
            examples:
              basic:
                value:
                  ratings:
                    overall: 5
                    speed: 4
                  comments: Great service.
      responses:
        '200':
          description: Feedback submitted by token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  requestId:
                    type: string
                  token:
                    type: string
                  feedbackReceivedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Feedback token has already been used
        '410':
          description: Feedback token has expired

  /api/delivery/{requestId}/details:
    post:
      tags: [Delivery]
      summary: Submit Delivery Method and Details (Canonical)
      operationId: submitDeliveryDetails
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DeliveryDetailsPayload'
                - $ref: '#/components/schemas/DeliveryMethodAliasPayload'
            examples:
              email:
                value:
                  deliveryMethod: email
                  deliveryDetails:
                    email:
                      recipient: student@mapua.edu.ph
                      subject: Your document is ready
                      templateId: delivery-email-document
              physical_mail:
                value:
                  deliveryMethod: physical_mail
                  deliveryDetails:
                    physical_mail:
                      address: 123 Example St, Manila, 1000
                      carrier: LBC
                      requiresSignature: true
                      estimatedDays: 5
              pickup:
                value:
                  deliveryMethod: pickup
                  deliveryDetails:
                    pickup:
                      location: Registrar Office
                      hoursOfOperation: Mon-Fri 8:00 AM - 5:00 PM
              legacyAliasShape:
                value:
                  method: pickup
                  details:
                    pickup:
                      location: Registrar Office
      responses:
        '200':
          description: Delivery details saved. If delivery envelope is pending_external, orchestrator is auto-resumed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Delivery details saved (email) and processing started.
                  requestId:
                    type: string
                    example: REQ-20260606-042
                  deliveryMethod:
                    $ref: '#/components/schemas/DeliveryMethod'
                  deliveryDetails:
                    type: object
                    additionalProperties: true
                  autoResumed:
                    type: boolean
                    description: True when route promoted delivery to in_progress and resumed orchestrator.
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/delivery/{requestId}/method:
    get:
      tags: [Delivery]
      summary: Get Delivery Method
      operationId: getDeliveryMethod
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      responses:
        '200':
          description: Current delivery method and status
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  deliveryMethod:
                    type: string
                    nullable: true
                    example: PHYSICAL_MAIL
                  status:
                    type: string
                  details:
                    type: object
                  availableMethods:
                    type: object

    post:
      tags: [Delivery]
      summary: Select Delivery Method (Legacy Alias)
      description: Backward-compatible alias route. Canonical route is POST /api/delivery/{requestId}/details.
      operationId: updateDeliveryMethodAlias
      deprecated: true
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryMethodAliasPayload'
            examples:
              pickup:
                value:
                  method: pickup
                  details:
                    pickup:
                      location: Registrar Office
                      contact: 02-123-4567
              physical_mail:
                value:
                  method: physical_mail
                  details:
                    physical_mail:
                      mailingAddress: 123 Example St, Manila
      responses:
        '200':
          description: Alias accepted and delegated to canonical /details flow
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  requestId:
                    type: string
                  deliveryMethod:
                    $ref: '#/components/schemas/DeliveryMethod'
                  deliveryDetails:
                    type: object
                    additionalProperties: true
                  autoResumed:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/delivery/{requestId}:
    get:
      tags: [Delivery]
      summary: Get Delivery Status
      operationId: getDeliveryStatus
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      responses:
        '200':
          description: Delivery information
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  status:
                    type: string
                  method:
                    type: string
                  details:
                    type: object
                  deliveryAttempts:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'

  /api/delivery-status/{requestId}:
    post:
      tags: [Delivery]
      summary: Update Delivery Status (Method-Aware Guardrails)
      operationId: updateDeliveryStatus
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Send code_number/code_name for the selected delivery method.
                Legacy status field is still accepted for backward compatibility.
              anyOf:
                - required: [code_number]
                - required: [code_name]
                - required: [status]
              properties:
                code_number:
                  type: integer
                  description: Preferred numeric status code. Must belong to the request's selected delivery method.
                  example: 1
                code_name:
                  type: string
                  description: Preferred status name. Must belong to the request's selected delivery method.
                  example: email_sent
                status:
                  $ref: '#/components/schemas/DeliveryStatusInput'
                notes:
                  type: string
                  example: Package handed to courier.
                trackingId:
                  type: string
                  example: TRACK-ABC-123
                location:
                  type: string
                  example: Manila Sorting Center
                timestamp:
                  type: string
                  format: date-time
            examples:
              emailPendingByCode:
                value:
                  code_number: 0
                  notes: Email queued for sending
              emailSentByName:
                value:
                  code_name: email_sent
                  notes: Email delivered to recipient inbox
              physicalMailInTransit:
                value:
                  code_number: 2
                  notes: Parcel dispatched by courier
                  trackingId: TRACK-ABC-123
                  location: Manila Sorting Center
              pickupReadyByName:
                value:
                  code_name: ready_for_pickup
                  notes: Document ready at registrar office.
              pickupCompleted:
                value:
                  code_number: 2
                  notes: Student collected document at counter
      responses:
        '200':
          description: Status updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

