        deletedCount:
          type: integer
    ServiceSummary:
      type: object
      properties:
        serviceId:
          type: string
          example: SERVICE-999
        id:
          type: string
          example: SERV-1-04152026
        name:
          type: string
        description:
          type: string
        type:
          type: string
        yaml:
          type: string
    ServiceDefinitionDetails:
      type: object
      properties:
        serviceId:
          type: string
        id:
          type: string
        name:
          type: string
        service_id:
          type: string
        service_name:
          type: string
        type:
          type: string
        description:
          type: string
        envelopes:
          type: object
          additionalProperties: true
        requestParameters:
          type: array
          items:
            type: object
            additionalProperties: true
    RequestCreatePayload:
