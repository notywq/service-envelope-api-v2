components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    MachineClientCredentials:
      type: oauth2
      description: |
        Swagger Authorize support for machine API clients. Use the clientId and
        clientSecret returned by POST /api/admin/api-clients or secret rotation.
        Swagger UI will call POST /api/auth/client-token and store the returned
        bearer token for protected operational API calls.
      flows:
        clientCredentials:
          tokenUrl: /api/auth/client-token
          scopes:
            services:read: Read service definitions.
            services:delete: Delete service definitions.
            requests:create: Create service requests.
            requests:list: List service requests.
            requests:read: Read service request details.
            requests:history: Read service request history.
            requests:resume: Resume paused service requests.
            requests:cancel: Cancel service requests.
            delivery:read: Read delivery details and selected methods.
            delivery:update: Submit delivery details and method choices.
            delivery-status:read: Read delivery status and history.
            delivery-status:update: Submit delivery status updates.
            payments:complete: Mark payments as completed.
            payments:fail: Mark payments as failed.
            payments:webhook: Submit payment gateway webhook events.
            approvals:read: Read approval token status and approval request details.
            approvals:submit: Submit approval token decisions.
            feedback:read: Read feedback data.
            feedback:submit: Submit feedback responses.
            processing:read: Read processing envelope state and summaries.
  parameters:
    ServiceIdParam:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
      example: SERVICE-999
      description: Service identifier.
    RequestIdParam:
      name: requestId
      in: path
      required: true
      schema:
        type: string
      example: REQ-20260606-042
      description: Request identifier.
    TokenParam:
      name: token
      in: path
      required: true
      schema:
        type: string
      example: 2d2f5e0a-5a8f-4b7d-a365-6dd77c9f17d8
      description: Approval or feedback token.
    TaskNameParam:
      name: taskName
      in: path
      required: true
      schema:
        type: string
      example: Verify Student Records
      description: Processing task name.
    TemplateIdParam:
      name: templateId
      in: path
      required: true
      schema:
        type: string
      example: SERV-1-approval
      description: Email template ID.
    AuthEmailParam:
      name: email
      in: path
      required: true
      schema:
        type: string
        format: email
      example: barondimaranan@gmail.com
      description: Auth user email address.
    ClientIdParam:
      name: clientId
      in: path
      required: true
      schema:
        type: string
      example: cli_qZ3p0YFlx9x5nM0U6m1JX22i
      description: Machine API client identifier.
    VersionParam:
      name: version
      in: path
      required: true
      schema:
        type: string
      example: 1.0.0
      description: Schema version.
    StatusQueryParam:
      name: status
      in: query
      required: false
      schema:
        type: string
      example: pending_payment
      description: Filter by request overall status.
    TypeQueryParam:
      name: type
      in: query
      required: false
      schema:
        type: string
      example: comprehensive-student-document
      description: Filter by request type.
    LimitQueryParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 1000
      example: 20
    OffsetQueryParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      example: 0
    TemplateScopeQueryParam:
      name: templateScope
      in: query
      required: false
      schema:
        type: string
        enum:
          - generic
          - envelope
          - service
      example: envelope
      description: Allowed values are constrained.
    EventKeyQueryParam:
      name: eventKey
      in: query
      required: false
      schema:
        type: string
      example: request-approved
    EnvelopeTypeQueryParam:
      name: envelopeType
      in: query
      required: false
      schema:
        type: string
      example: approval
    PhaseQueryParam:
      name: phase
      in: query
      required: false
      schema:
        type: string
      example: phase2
    ServiceTypeQueryParam:
      name: serviceType
      in: query
      required: false
      schema:
        type: string
      example: comprehensive-student-document
    IsActiveQueryParam:
      name: isActive
      in: query
      required: false
      schema:
        type: string
        enum:
          - "true"
          - "false"
      example: "true"
      description: Route compares stringified boolean values.
  schemas:
    ApiRole:
      type: string
      enum:
        - super_admin
        - admin
        - requester
        - orchestrator
      example: requester
    ApiClientRole:
      type: string
      enum:
        - orchestrator
        - service
      example: orchestrator
    ApiClientScopeDefinition:
      type: object
      properties:
        scope:
          type: string
          example: requests:create
        label:
          type: string
          example: Create requests
        description:
          type: string
        endpoints:
          type: array
          items:
            type: string
          example:
            - POST /api/requests
    ApiClientScopeGroup:
      type: object
      properties:
        id:
          type: string
          example: requests
        label:
          type: string
          example: Requests
        description:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiClientScopeDefinition"
    ApiClientScopeCatalogResponse:
      type: object
      properties:
        scopeGroups:
          type: array
          items:
            $ref: "#/components/schemas/ApiClientScopeGroup"
        scopes:
          type: array
          items:
            type: string
          example:
            - services:read
            - requests:create
            - requests:read
        total:
          type: integer
          example: 20
    ClientCredentialsRequest:
      type: object
      description: Accepts either camelCase fields or OAuth-style snake_case fields.
      properties:
        grant_type:
          type: string
          enum:
            - client_credentials
          default: client_credentials
        grantType:
          type: string
          enum:
            - client_credentials
          default: client_credentials
        clientId:
          type: string
          example: cli_qZ3p0YFlx9x5nM0U6m1JX22i
        clientSecret:
          type: string
          format: password
          example: sec_live_example
        client_id:
          type: string
          example: cli_qZ3p0YFlx9x5nM0U6m1JX22i
        client_secret:
          type: string
          format: password
          example: sec_live_example
      oneOf:
        - required:
            - clientId
            - clientSecret
        - required:
            - client_id
            - client_secret
    OAuthClientCredentialsFormRequest:
      type: object
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          enum:
            - client_credentials
          default: client_credentials
        client_id:
          type: string
          example: cli_qZ3p0YFlx9x5nM0U6m1JX22i
          description: Optional when credentials are sent with HTTP Basic auth.
        client_secret:
          type: string
          format: password
          example: sec_live_example
          description: Optional when credentials are sent with HTTP Basic auth.
        scope:
          type: string
          description: Space-delimited requested scopes. If omitted, all scopes assigned to the API client are issued.
          example: requests:create requests:read services:read
    OAuthErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: invalid_scope
        error_description:
          type: string
          example: Client is not allowed to request scopes.
    ClientTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: string
          example: 1h
        access_token:
          type: string
          description: OAuth2-compatible bearer token field used by Swagger UI.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        scope:
          type: string
          example: requests:create requests:read
        client:
          type: object
          properties:
            clientId:
              type: string
            name:
              type: string
            role:
              $ref: "#/components/schemas/ApiClientRole"
            scopes:
              type: array
              items:
                type: string
    ApiClientRecord:
      type: object
      properties:
        clientId:
          type: string
          example: cli_qZ3p0YFlx9x5nM0U6m1JX22i
        name:
          type: string
          example: Student Portal Backend
        role:
          $ref: "#/components/schemas/ApiClientRole"
        scopes:
          type: array
          items:
            type: string
          example:
            - requests:create
            - requests:read
        isActive:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rotatedAt:
          type: string
          format: date-time
          nullable: true
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
    ApiClientCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Student Portal Backend
        role:
          $ref: "#/components/schemas/ApiClientRole"
        scopes:
          type: array
          items:
            type: string
          default: []
        isActive:
          type: boolean
          default: true
        metadata:
          type: object
          additionalProperties: true
    ApiClientUpdateRequest:
      type: object
      properties:
        name:
          type: string
        role:
          $ref: "#/components/schemas/ApiClientRole"
        scopes:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
    ApiClientCredentials:
      type: object
      properties:
        clientId:
          type: string
        clientSecret:
          type: string
          format: password
      description: Returned only on client creation and secret rotation.
    ApiClientCreateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        client:
          $ref: "#/components/schemas/ApiClientRecord"
        credentials:
          $ref: "#/components/schemas/ApiClientCredentials"
        message:
          type: string
    ApiClientMutationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        client:
          $ref: "#/components/schemas/ApiClientRecord"
    AuthUserPublic:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/ApiRole"
        name:
          type: string
    AuthUserRecord:
      allOf:
        - $ref: "#/components/schemas/AuthUserPublic"
