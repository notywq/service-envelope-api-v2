openapi: 3.0.0
info:
  title: Service Envelope API v2.0
  version: 2.1.0
  description: REST API for the Service Envelope System. Includes OTP bearer
    authentication, machine-to-machine client credentials, Mongo-backed auth
    users/API clients and roles, generic email template fallbacks, schema v1.0.5
    service validation, and unified delivery selection.
  contact:
    name: Service Envelope Team
  license:
    name: MIT
servers:
  - url: http://localhost:8000
    description: Development
  - url: https://api.mapua.edu.ph
    description: Production
security:
  - BearerAuth: []
  - MachineClientCredentials: []
paths:
  /health:
    get:
      tags:
        - System
      summary: Health Check
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    status: ok
                    timestamp: 2026-06-07T00:00:00.000Z
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl -X GET "http://localhost:8000/health"
  /api:
    get:
      tags:
        - System
      summary: API Information
      operationId: getApiInfo
      security: []
      responses:
        "200":
          description: API metadata and key endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Service Envelope API
                  version:
                    type: string
                    example: 1.0.0
                  endpoints:
                    type: array
                    items:
                      type: string
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    name: Service Envelope API
                    version: 1.0.0
                    endpoints:
                      - sample
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl -X GET "http://localhost:8000/api"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Password Login Disabled
      operationId: login
      security: []
      responses:
        "410":
          description: Password login is disabled. Use OTP login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                sample:
                  value:
                    error: Password login is disabled. Use POST /api/OTP/send and POST /api/OTP/verify.
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl -X POST "http://localhost:8000/api/auth/login"
  /api/auth/client-token:
    post:
      tags:
        - Auth
      summary: Issue Bearer Token For API Client
      operationId: issueClientToken
      security: []
      description: |
        Machine-to-machine token exchange. API clients are created by a super_admin
        through /api/admin/api-clients. The plaintext clientSecret is returned only
        during creation or secret rotation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCredentialsRequest"
            examples:
              camelCase:
                value:
                  clientId: cli_abc123
                  clientSecret: sec_live_example
              oauthStyle:
                value:
                  grant_type: client_credentials
                  client_id: cli_abc123
                  client_secret: sec_live_example
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthClientCredentialsFormRequest"
            encoding:
              scope:
                style: form
                explode: false
      responses:
        "200":
          description: Client credentials verified and bearer token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Requested scope is not assigned to this API client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: >-
            curl -X POST "http://localhost:8000/api/auth/client-token" \
              -H "Content-Type: application/json" \
              -d '{"clientId":"cli_abc123","clientSecret":"sec_live_example"}'
  /api/auth/verify:
    post:
      tags:
        - Auth
      summary: Verify Bearer Token
      operationId: verifyToken
      security:
        - BearerAuth: []
        - MachineClientCredentials: []
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  user:
                    type: object
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    valid: true
                    user:
                      email: barondimaranan@gmail.com
                      role: super_admin
                      name: Baron Dimaranan
                    expiresIn: 1h
        "401":
          $ref: "#/components/responses/Unauthorized"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: 'curl -X POST "http://localhost:8000/api/auth/verify" -H "Authorization: Bearer $TOKEN"'
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Get Current Bearer User
      operationId: getCurrentAuthUser
      security:
        - BearerAuth: []
        - MachineClientCredentials: []
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUserPublic"
                  expiresIn:
                    type: string
                    example: 1h
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/OTP/send:
    post:
      tags:
        - Auth
      summary: Send OTP Login Code
      operationId: sendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpSendRequest"
      responses:
        "202":
          description: OTP send accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSendResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: OTP was sent recently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: OTP email could not be sent
  /api/OTP/verify:
    post:
      tags:
        - Auth
      summary: Verify OTP And Issue Bearer Token
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OTP verified and bearer token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: OTP expired
        "429":
          description: Too many OTP attempts
  /api/OTP/cancel:
    post:
      tags:
        - Auth
      summary: Cancel Active OTP Challenges
      operationId: cancelOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpCancelRequest"
      responses:
        "200":
          description: Active OTP challenges cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpCancelResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/OTP/flush:
    post:
      tags:
        - Auth
      summary: Flush Stale OTP Challenges
      operationId: flushOtp
      security:
        - BearerAuth: []
      description: Requires a super_admin bearer token.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                consumedRetentionHours:
                  type: number
                  default: 24
      responses:
        "200":
          description: Stale OTP records flushed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpFlushResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/services:
    get:
      tags:
        - Services
      summary: List All Services
      operationId: listAllServices
      security:
        - BearerAuth: []
        - MachineClientCredentials:
            - services:read
      responses:
        "200":
          description: All available services
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 4
                  services:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceSummary"
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    count: 4
                    services:
                      - serviceId: SERVICE-999
                        id: SERV-1-04152026
                        name: sample
                        description: sample
                        type: sample
                        yaml: sample
        "500":
          $ref: "#/components/responses/ServerError"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl -X GET "http://localhost:8000/api/services"
  /api/services/ids:
    get:
      tags:
        - Services
      summary: Get Service IDs Quick Reference
      operationId: getServiceIds
      security:
        - BearerAuth: []
        - MachineClientCredentials:
            - services:read
      responses:
        "200":
          description: ID/name mapping and list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  serviceMap:
                    type: object
                    additionalProperties:
                      type: string
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        serviceId:
                          type: string
                        id:
                          type: string
                        name:
                          type: string
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    count: 1
                    serviceMap:
                      sampleKey: sampleValue
                    services:
                      - serviceId: sample
                        id: sample
                        name: sample
        "500":
          $ref: "#/components/responses/ServerError"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl -X GET "http://localhost:8000/api/services/ids"
  /api/services/{serviceId}:
    get:
      tags:
        - Services
      summary: Get Service Details
      operationId: getServiceDetails
      security:
        - BearerAuth: []
        - MachineClientCredentials:
            - services:read
      parameters:
        - $ref: "#/components/parameters/ServiceIdParam"
      responses:
        "200":
          description: Service definition details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDefinitionDetails"
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    serviceId: sample
                    id: sample
                    name: sample
                    service_id: sample
                    service_name: sample
                    type: sample
                    description: sample
                    envelopes:
                      sampleKey: sampleValue
                    requestParameters:
                      - sampleKey: sampleValue
        "404":
          $ref: "#/components/responses/NotFound"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl -X GET "http://localhost:8000/api/services/SERV-STUDENT-ID-001"
    delete:
      tags:
        - Services
      summary: Delete Service
      operationId: deleteService
      security:
        - BearerAuth: []
        - MachineClientCredentials:
            - services:delete
      parameters:
        - $ref: "#/components/parameters/ServiceIdParam"
      responses:
        "200":
          description: Service deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  serviceId:
                    type: string
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    success: true
                    message: sample
                    serviceId: sample
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl -X DELETE "http://localhost:8000/api/services/SERV-STUDENT-ID-001"
  /api/requests:
    get:
      tags:
        - Requests
      summary: List All Requests
      operationId: listAllRequests
      security:
        - BearerAuth: []
        - MachineClientCredentials:
            - requests:list
      parameters:
        - $ref: "#/components/parameters/StatusQueryParam"
        - $ref: "#/components/parameters/TypeQueryParam"
        - $ref: "#/components/parameters/LimitQueryParam"
        - $ref: "#/components/parameters/OffsetQueryParam"
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestListResponse"
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    total: 1
                    count: 1
                    limit: 1
                    offset: 1
                    requests:
                      - id: sample
                        type: sample
                        initiator: sample
                        status: sample
                        createdAt: 2026-06-07T00:00:00.000Z
                        lastUpdated: 2026-06-07T00:00:00.000Z
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl -X GET "http://localhost:8000/api/requests"
    post:
      tags:
        - Requests
      summary: Create Request
      operationId: createRequest
      security:
        - BearerAuth: []
        - MachineClientCredentials:
            - requests:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCreatePayload"
            examples:
              usingServiceId:
                value:
                  serviceId: SERVICE-999
                  initiator: requester@mapua.edu.ph
                  parameters:
                    studentId: 20250001
                    firstName: Juan
                    lastName: Dela Cruz
                    email: juan.delacruz@mapua.edu.ph
              usingType:
                value:
                  type: comprehensive-student-document
                  initiator: requester@mapua.edu.ph
                  parameters:
                    studentId: 20250001
                    firstName: Juan
                    lastName: Dela Cruz
                    email: juan.delacruz@mapua.edu.ph
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRequestResponse"
              examples:
                sample:
                  summary: Sample 201 response
                  value:
                    success: true
                    requestId: REQ-20260606-042
                    type: sample
                    serviceId: sample
                    status: queued
                    envelopes:
                      sampleKey: sampleValue
                    message: sample
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            curl -X POST "http://localhost:8000/api/requests" \
              -H "Content-Type: application/json" \
              -d '{"sample":true}'
  /api/requests/{requestId}:
    get:
      tags:
        - Requests
      summary: Get Request Details
      operationId: getRequestDetails
      security:
        - BearerAuth: []
        - MachineClientCredentials:
            - requests:read
      parameters:
        - $ref: "#/components/parameters/RequestIdParam"
      responses:
        "200":
          description: Request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetailsResponse"
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    id: sample
                    type: sample
                    initiator: sample
                    status: sample
                    createdAt: 2026-06-07T00:00:00.000Z
                    lastUpdated: 2026-06-07T00:00:00.000Z
                    envelopes:
                      sampleKey: sampleValue
                    history:
                      - sampleKey: sampleValue
        "404":
          $ref: "#/components/responses/NotFound"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl -X GET "http://localhost:8000/api/requests/REQ-20260606-865"
    delete:
      tags:
        - Requests
      summary: Cancel Request
      operationId: cancelRequest
      security:
        - BearerAuth: []
        - MachineClientCredentials:
            - requests:cancel
      parameters:
        - $ref: "#/components/parameters/RequestIdParam"
      responses:
        "200":
          description: Request cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    example: REQ-20260606-042
                  status:
                    type: string
                    example: cancelled
                  message:
                    type: string
                    example: Request cancelled successfully
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    requestId: REQ-20260606-042
                    status: cancelled
                    message: Request cancelled successfully
        "404":
          $ref: "#/components/responses/NotFound"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl -X DELETE "http://localhost:8000/api/requests/REQ-20260606-865"
  /api/requests/{requestId}/resume:
    post:
      tags:
        - Requests
      summary: Resume Request
      operationId: resumeRequest
      security:
        - BearerAuth: []
        - MachineClientCredentials:
            - requests:resume
      parameters:
        - $ref: "#/components/parameters/RequestIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            examples:
              sample:
                summary: Sample request
                value: {}
      responses:
        "200":
          description: Request resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  message:
                    type: string
                  status:
                    type: string
                    example: processing
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    requestId: sample
                    message: sample
                    status: processing
        "404":
          $ref: "#/components/responses/NotFound"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: >-
            curl -X POST
            "http://localhost:8000/api/requests/REQ-20260606-865/resume" \
              -H "Content-Type: application/json" \
              -d '{}'
  /api/requests/{requestId}/history:
    get:
      tags:
        - Requests
      summary: Get Request History
      operationId: getRequestHistory
      security:
        - BearerAuth: []
        - MachineClientCredentials:
            - requests:history
      parameters:
        - $ref: "#/components/parameters/RequestIdParam"
      responses:
        "200":
          description: Request history
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  history:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  totalEntries:
                    type: integer
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    requestId: sample
                    history:
                      - sampleKey: sampleValue
                    totalEntries: 1
        "404":
          $ref: "#/components/responses/NotFound"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl -X GET
            "http://localhost:8000/api/requests/REQ-20260606-865/history"
  /api/approvals/admin/tokens/{requestId}:
    get:
      tags:
        - Approvals
      summary: Get Approval Tokens (Approvals Admin)
      operationId: getApprovalTokensByRequestInApprovalsRoute
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestIdParam"
      responses:
        "200":
          description: Tokens for request
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  count:
                    type: integer
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalTokenInfo"
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    requestId: sample
                    count: 1
                    tokens:
                      - token: sample
                        approverId: sample
                        requestId: sample
                        used: true
                        expiresAt: 2026-06-07T00:00:00.000Z
                        createdAt: 2026-06-07T00:00:00.000Z
        "404":
          $ref: "#/components/responses/NotFound"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl -X GET
            "http://localhost:8000/api/approvals/admin/tokens/REQ-20260606-865"
  /api/approvals/{token}:
    get:
      tags:
        - Approvals
      summary: Check Approval Token Status
      operationId: checkApprovalTokenStatus
      security: []
      parameters:
        - $ref: "#/components/parameters/TokenParam"
      responses:
        "200":
          description: Token status
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  requestId:
                    type: string
                  approverId:
                    type: string
                  used:
                    type: boolean
                  expired:
                    type: boolean
                  expiresAt:
                    type: string
                    format: date-time
                  createdAt:
                    type: string
                    format: date-time
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    token: sample
                    requestId: sample
                    approverId: sample
                    used: true
                    expired: true
                    expiresAt: 2026-06-07T00:00:00.000Z
                    createdAt: 2026-06-07T00:00:00.000Z
        "404":
          $ref: "#/components/responses/NotFound"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl -X GET
            "http://localhost:8000/api/approvals/94c2fea5-7de6-427c-9da8-ad3948673177"
  /api/approvals/{token}/approve:
    post:
      tags:
        - Approvals
      summary: Approve Request by Token
      operationId: approveRequest
      security: []
      parameters:
        - $ref: "#/components/parameters/TokenParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  example: Approved by registrar.
            examples:
              sample:
                summary: Sample request
                value:
                  comment: Approved by registrar.
      responses:
        "200":
          description: Approval processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  status:
                    type: string
                    example: approved
                  message:
                    type: string
                  approvalComplete:
                    type: boolean
                  rule:
                    type: string
                  nextStatus:
                    type: string
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    requestId: sample
                    status: approved
                    message: sample
                    approvalComplete: true
                    rule: sample
                    nextStatus: sample
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Approval stage already finalized
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            curl -X POST "http://localhost:8000/api/approvals/94c2fea5-7de6-427c-9da8-ad3948673177/approve" \
              -H "Content-Type: application/json" \
              -d '{"comment":"Approved by registrar."}'
  /api/approvals/{token}/deny:
    post:
      tags:
        - Approvals
      summary: Deny Request by Token
      operationId: denyRequest
      security: []
      parameters:
        - $ref: "#/components/parameters/TokenParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  example: Missing required supporting document.
            examples:
              sample:
                summary: Sample request
                value:
                  reason: Missing required supporting document.
      responses:
        "200":
          description: Request cancelled after denial
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  status:
                    type: string
                    example: cancelled
                  message:
                    type: string
                  reason:
                    type: string
              examples:
                sample:
                  summary: Sample 200 response
                  value:
                    requestId: sample
                    status: cancelled
                    message: sample
                    reason: sample
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Approval stage already finalized
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            curl -X POST "http://localhost:8000/api/approvals/94c2fea5-7de6-427c-9da8-ad3948673177/deny" \
