            pickup:
              type: object
              properties:
                location:
                  type: string
                  example: Registrar Office
                hoursOfOperation:
                  type: string
                  example: Mon-Fri 8:00 AM - 5:00 PM
                pickupDeadlineAt:
                  type: string
                  format: date-time
          additionalProperties: true
    DeliveryMethodAliasPayload:
      type: object
      required:
        - method
      properties:
        method:
          $ref: "#/components/schemas/DeliveryMethod"
        details:
          type: object
          additionalProperties: true
      description: Legacy payload shape used by POST /api/delivery/{requestId}/method.
    DeliveryStatusInput:
      description: |-
        Legacy-compatible status values in delivery-status route.
        Preferred fields are code_number / code_name (method-aware guardrails).
        This schema remains for backward compatibility.
      oneOf:
        - type: integer
          enum:
            - 0
            - 1
            - 2
            - 3
          example: 1
        - type: string
          enum:
            - email_pending
            - email_sent
            - preparing
            - ready_to_deliver
            - out_for_delivery
            - delivered
            - ready_for_pickup
            - picked_up
            - processing
            - in_transit
            - received
            - pickup_complete
          example: email_sent
    ApprovalTokenInfo:
      type: object
      properties:
        token:
          type: string
        approverId:
          type: string
        requestId:
          type: string
        used:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    FeedbackTokenStatus:
      type: object
      properties:
        token:
          type: string
        requestId:
          type: string
        isUsed:
          type: boolean
        isExpired:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        submittedFeedback:
          type: object
          nullable: true
          additionalProperties: true
    MayaWebhookPayload:
      type: object
      properties:
        checkoutId:
          type: string
        requestReferenceNumber:
          type: string
          example: REQ-20260606-042
        customField:
          type: object
          properties:
            requestId:
              type: string
              example: REQ-20260606-042
        transactionId:
          type: string
          example: MAYA-TXN-20260606-001
        status:
          type: string
          enum:
            - SUCCESS
            - COMPLETED
            - FAILURE
            - FAILED
            - PENDING
          example: SUCCESS
        amount:
          type: number
          example: 350
        currency:
          type: string
          example: PHP
        timestamp:
          type: string
          format: date-time
    CreateServicePayload:
      type: object
      required:
        - name
        - yaml
        - type
        - initiator
      properties:
        name:
          type: string
          example: Transcript Request
        yaml:
          type: string
          description: Full service definition YAML text.
        type:
          type: string
          example: request-tor
        initiator:
          type: string
          example: student
    EmailTemplate:
      type: object
      properties:
        id:
          type: string
          example: SERV-1-approval
        name:
          type: string
          example: Approval Request Template
        subject:
          type: string
          example: Approval needed for {{requestId}}
        htmlBody:
          type: string
        description:
          type: string
        templateScope:
          type: string
          enum:
            - generic
            - envelope
            - service
        eventKey:
          type: string
        serviceType:
          type: string
        isActive:
          type: boolean
        envelopeType:
          type: string
        phase:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EmailTemplateCreate:
      type: object
      required:
        - id
        - name
        - subject
        - htmlBody
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        htmlBody:
          type: string
        description:
          type: string
        templateScope:
          type: string
          enum:
            - generic
            - envelope
            - service
        eventKey:
          type: string
        serviceType:
          type: string
        isActive:
          type: boolean
        envelopeType:
          type: string
        phase:
          type: string
    EmailTemplateUpdate:
      type: object
      required:
        - name
        - subject
        - htmlBody
      properties:
        name:
          type: string
        subject:
          type: string
        htmlBody:
          type: string
        description:
          type: string
        templateScope:
          type: string
          enum:
            - generic
            - envelope
            - service
        eventKey:
          type: string
        serviceType:
          type: string
        isActive:
          type: boolean
        envelopeType:
          type: string
        phase:
          type: string
    SchemaResponse:
      type: object
      properties:
        schema:
          type: object
          additionalProperties: true
        version:
          type: string
        name:
          type: string
        description:
          type: string
        lastUpdated:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Request not found
        details:
          type: string
  responses:
    BadRequest:
      description: Bad Request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            sample:
              summary: Sample 400 response
              value:
                error: Request not found
                details: sample
    Unauthorized:
      description: Unauthorized - Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            sample:
              summary: Sample 401 response
              value:
                error: Request not found
                details: sample
    Forbidden:
      description: Forbidden - Authenticated user does not have the required role or ownership
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            insufficientRole:
              value:
                error: Insufficient permissions
    NotFound:
      description: Not Found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            sample:
              summary: Sample 404 response
              value:
                error: Request not found
                details: sample
    ServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            sample:
              summary: Sample 500 response
              value:
                error: Request not found
                details: sample
