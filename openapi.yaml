                type: string
              type:
                type: string
              initiator:
                type: string
              status:
                type: string
              createdAt:
                type: string
                format: date-time
              lastUpdated:
                type: string
                format: date-time
    RequestDetailsResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        initiator:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        envelopes:
          type: object
          additionalProperties: true
        history:
          type: array
          items:
            type: object
            additionalProperties: true
    DeliveryMethod:
      type: string
      enum:
        - email
        - physical_mail
        - pickup
      example: physical_mail
      description: Allowed values are constrained by route validation.
    DeliveryDetailsPayload:
      type: object
      required:
        - deliveryMethod
        - deliveryDetails
      properties:
        deliveryMethod:
          $ref: "#/components/schemas/DeliveryMethod"
        deliveryDetails:
          type: object
          description: |
            Method-specific details. Route accepts either nested format
            (e.g., {"email": {...}}) or direct object for the selected method.
          properties:
            email:
              type: object
              properties:
                recipient:
                  type: string
                  example: student@mapua.edu.ph
                subject:
                  type: string
                  example: Your document is ready
                templateId:
                  type: string
                  example: delivery-email-document
                attachmentUrls:
                  type: array
                  items:
                    type: string
                    format: uri
