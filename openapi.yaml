components:
  parameters:
    ServiceIdParam:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
      example: SERVICE-999
      description: Service identifier.

    RequestIdParam:
      name: requestId
      in: path
      required: true
      schema:
        type: string
      example: REQ-20260606-042
      description: Request identifier.

    TokenParam:
      name: token
      in: path
      required: true
      schema:
        type: string
      example: 2d2f5e0a-5a8f-4b7d-a365-6dd77c9f17d8
      description: Approval or feedback token.

    TaskNameParam:
      name: taskName
      in: path
      required: true
      schema:
        type: string
      example: Verify Student Records
      description: Processing task name.

    TemplateIdParam:
      name: templateId
      in: path
      required: true
      schema:
        type: string
      example: SERV-1-approval
      description: Email template ID.

    VersionParam:
      name: version
      in: path
      required: true
      schema:
        type: string
      example: 1.0.0
      description: Schema version.

    StatusQueryParam:
      name: status
      in: query
      required: false
      schema:
        type: string
      example: pending_payment
      description: Filter by request overall status.

    TypeQueryParam:
      name: type
      in: query
      required: false
      schema:
        type: string
      example: comprehensive-student-document
      description: Filter by request type.

    LimitQueryParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 1000
      example: 20

    OffsetQueryParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      example: 0

    TemplateScopeQueryParam:
      name: templateScope
      in: query
      required: false
      schema:
        type: string
        enum: [generic, envelope, service]
      example: envelope
      description: Allowed values are constrained.

    EventKeyQueryParam:
      name: eventKey
      in: query
      required: false
      schema:
        type: string
      example: request-approved

    EnvelopeTypeQueryParam:
      name: envelopeType
      in: query
      required: false
      schema:
        type: string
      example: approval

    PhaseQueryParam:
      name: phase
      in: query
      required: false
      schema:
        type: string
      example: phase2

    ServiceTypeQueryParam:
      name: serviceType
      in: query
      required: false
      schema:
        type: string
      example: comprehensive-student-document

    IsActiveQueryParam:
      name: isActive
      in: query
      required: false
      schema:
        type: string
        enum: ['true', 'false']
      example: 'true'
      description: Route compares stringified boolean values.

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            email:
              type: string
              format: email
            name:
              type: string
            role:
              type: string
              enum: [admin, approver, requester]
              example: requester
        expiresIn:
          type: string
          example: 24h

    ServiceSummary:
      type: object
      properties:
        serviceId:
          type: string
          example: SERVICE-999
        id:
          type: string
          example: SERV-1-04152026
        name:
          type: string
        description:
          type: string
        type:
          type: string
        yaml:
          type: string

    ServiceDefinitionDetails:
      type: object
      properties:
        serviceId:
          type: string
        id:
          type: string
        name:
          type: string
        service_id:
          type: string
        service_name:
          type: string
        type:
          type: string
        description:
          type: string
        envelopes:
          type: object
          additionalProperties: true
        requestParameters:
          type: array
          items:
            type: object
            additionalProperties: true

    RequestCreatePayload:
      type: object
      required: [initiator, parameters]
      properties:
        type:
          type: string
          description: Service type identifier.
          example: comprehensive-student-document
        serviceId:
          type: string
          description: Service ID identifier.
          example: SERVICE-999
        initiator:
          type: string
          description: Actor creating the request.
          example: requester@mapua.edu.ph
        parameters:
          type: object
          additionalProperties: true
      anyOf:
        - required: [type]
        - required: [serviceId]

    CreateRequestResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        requestId:
          type: string
          example: REQ-20260606-042
        type:
          type: string
        serviceId:
          type: string
        status:
          type: string
          example: queued
        envelopes:
          type: object
          additionalProperties: true
        message:
          type: string

    RequestListResponse:
      type: object
      properties:
        total:
          type: integer
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        requests:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              initiator:
                type: string
              status:
                type: string
              createdAt:
                type: string
                format: date-time
              lastUpdated:
                type: string
                format: date-time

    RequestDetailsResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        initiator:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        envelopes:
          type: object
          additionalProperties: true
        history:
          type: array
          items:
            type: object
            additionalProperties: true

    DeliveryMethod:
      type: string
      enum: [email, physical_mail, pickup]
      example: physical_mail
      description: Allowed values are constrained by route validation.

    DeliveryDetailsPayload:
      type: object
      required: [deliveryMethod, deliveryDetails]
      properties:
        deliveryMethod:
          $ref: '#/components/schemas/DeliveryMethod'
        deliveryDetails:
          type: object
          description: |
            Method-specific details. Route accepts either nested format
            (e.g., {"email": {...}}) or direct object for the selected method.
          properties:
            email:
              type: object
              properties:
                recipient:
                  type: string
                  example: student@mapua.edu.ph
                subject:
                  type: string
                  example: Your document is ready
                templateId:
                  type: string
                  example: delivery-email-document
                attachmentUrls:
                  type: array
                  items:
                    type: string
                    format: uri
            physical_mail:
              type: object
              properties:
                address:
                  type: string
                  example: 123 Example St, Manila, 1000
                carrier:
                  type: string
                  example: LBC
                trackingId:
                  type: string
                requiresSignature:
                  type: boolean
                estimatedDays:
                  type: integer
            pickup:
              type: object
              properties:
                location:
                  type: string
                  example: Registrar Office
                hoursOfOperation:
                  type: string
                  example: Mon-Fri 8:00 AM - 5:00 PM
                pickupDeadlineAt:
                  type: string
                  format: date-time
          additionalProperties: true

    DeliveryMethodAliasPayload:
      type: object
      required: [method]
      properties:
        method:
          $ref: '#/components/schemas/DeliveryMethod'
        details:
          type: object
          additionalProperties: true
      description: Legacy payload shape used by POST /api/delivery/{requestId}/method.

    DeliveryStatusInput:
      description: |-
        Legacy-compatible status values in delivery-status route.
        Preferred fields are code_number / code_name (method-aware guardrails).
        This schema remains for backward compatibility.
      oneOf:
        - type: integer
          enum: [0, 1, 2, 3]
          example: 1
        - type: string
          enum: [email_pending, email_sent, preparing, ready_to_deliver, out_for_delivery, delivered, ready_for_pickup, picked_up, processing, in_transit, received, pickup_complete]
          example: email_sent

    ApprovalTokenInfo:
      type: object
      properties:
        token:
          type: string
        approverId:
          type: string
        requestId:
          type: string
        used:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    FeedbackTokenStatus:
      type: object
      properties:
        token:
          type: string
        requestId:
          type: string
        isUsed:
          type: boolean
        isExpired:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        submittedFeedback:
          type: object
          nullable: true
          additionalProperties: true

    MayaWebhookPayload:
      type: object
      properties:
        checkoutId:
          type: string
        requestReferenceNumber:
          type: string
          example: REQ-20260606-042
        customField:
          type: object
          properties:
            requestId:
              type: string
              example: REQ-20260606-042
        transactionId:
          type: string
          example: MAYA-TXN-20260606-001
        status:
          type: string
          enum: [SUCCESS, COMPLETED, FAILURE, FAILED, PENDING]
          example: SUCCESS
        amount:
          type: number
          example: 350
        currency:
          type: string
          example: PHP
        timestamp:
          type: string
          format: date-time

    CreateServicePayload:
      type: object
      required: [name, yaml, type, initiator]
      properties:
        name:
          type: string
          example: Transcript Request
        yaml:
          type: string
          description: Full service definition YAML text.
        type:
          type: string
          example: request-tor
        initiator:
          type: string
          example: student

    EmailTemplate:
      type: object
      properties:
        id:
          type: string
          example: SERV-1-approval
        name:
          type: string
          example: Approval Request Template
        subject:
          type: string
          example: Approval needed for {{requestId}}
        htmlBody:
          type: string
        description:
          type: string
        templateScope:
          type: string
          enum: [generic, envelope, service]
        eventKey:
          type: string
        serviceType:
          type: string
        isActive:
          type: boolean
        envelopeType:
          type: string
        phase:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EmailTemplateCreate:
      type: object
      required: [id, name, subject, htmlBody]
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        htmlBody:
          type: string
        description:
          type: string
        templateScope:
          type: string
          enum: [generic, envelope, service]
        eventKey:
          type: string
        serviceType:
          type: string
        isActive:
          type: boolean
        envelopeType:
          type: string
        phase:
          type: string

    EmailTemplateUpdate:
      type: object
      required: [name, subject, htmlBody]
      properties:
        name:
          type: string
        subject:
          type: string
        htmlBody:
          type: string
        description:
          type: string
        templateScope:
          type: string
          enum: [generic, envelope, service]
        eventKey:
          type: string
        serviceType:
          type: string
        isActive:
          type: boolean
        envelopeType:
          type: string
        phase:
          type: string

    SchemaResponse:
      type: object
      properties:
        schema:
          type: object
          additionalProperties: true
        version:
          type: string
        name:
          type: string
        description:
          type: string
        lastUpdated:
          type: string
          format: date-time

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Request not found
        details:
          type: string

  responses:
    BadRequest:
      description: Bad Request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized - Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Not Found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

