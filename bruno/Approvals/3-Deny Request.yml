info:
  name: Deny Request
  type: http
  seq: 3

http:
  method: POST
  url: {{baseUrl}}/api/approvals/{{token}}/deny
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "comment": "Request denied - missing required documentation"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Deny a request using an approval token
