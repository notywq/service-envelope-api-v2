info:
  name: Check Token Status
  type: http
  seq: 1

http:
  method: GET
  url: {{baseUrl}}/api/approvals/{{token}}
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Check the status of an approval token
