info:
  name: Approve Request
  type: http
  seq: 2

http:
  method: POST
  url: {{baseUrl}}/api/approvals/{{token}}/approve
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "comment": "Approved - all prerequisites satisfied"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Approve a request using an approval token
