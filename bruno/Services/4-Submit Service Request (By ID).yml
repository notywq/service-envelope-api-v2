info:
  name: Submit Service Request (By ID)
  type: http
  seq: 4

http:
  method: POST
  url: {{baseUrl}}/api/services/{{serviceId}}/submit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "studentId": 123456,
        "courseCode": "IT101",
        "semester": "2025-1",
        "initiator": "student_portal"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Submit a new service request using the service ID in the path
