info:
  name: Get Request History
  type: http
  seq: 5

http:
  method: GET
  url: {{baseUrl}}/api/requests/{{requestId}}/history
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Get complete history of a request including all status changes
