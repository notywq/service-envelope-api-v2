id: SERV-1-04152026
name: Course Enrollment Service
description: Process for student course enrollment and registration
type: courseEnrollment
serviceCode: courseEnrollment
initiator: Student

envelopes:
  request:
    required: true
    parameters:
      studentId: String (e.g., 2020-00123)
      email: String (student email)
      courseCode: String (e.g., CS101)
      courseName: String
      section: String (e.g., A, B, C)
      semester: String (1st, 2nd, Summer)
      academicYear: String (e.g., 2025-2026)

  approval:
    required: true
    emailTemplateId: SERV-1-approval
    approvers:
      - id: registrar@mapua.edu.ph
        role: Registrar
      - id: advisor@mapua.edu.ph
        role: Academic Advisor
    approvalRules:
      type: all_must_approve
    expiryHours: 24

  payment:
    required: true
    paymentProvider: maya
    charges:
      - item: Tuition Fee
        amount: 5000.00
        currency: PHP
      - item: Lab Fee
        amount: 500.00
        currency: PHP

  processing:
    required: true
    stopOnFailure: true
    tasks:
      - name: validate_prerequisites
        description: Check if student has completed prerequisites
        type: built_in
        builtIn:
          function: validate_prerequisites
          parameters:
            studentId: "{{studentId}}"
            courseCode: "{{courseCode}}"

      - name: check_enrollment_capacity
        description: Verify course section has available slots
        type: webhook
        webhook:
          url: https://sis-api.mapua.edu.ph/courses/check-capacity
          method: POST
          timeout: 30000
          retries: 3

      - name: register_student
        description: Add student to course roster
        type: webhook
        webhook:
          url: https://sis-api.mapua.edu.ph/enrollment/register
          method: POST
          timeout: 30000
          retries: 2

  delivery:
    required: true
    method: email
    emailTemplateId: SERV-1-delivery
    email:
      subject: "Course Enrollment Confirmation - [COURSE_CODE]"
      recipient: "{{email}}"
      attachmentInclude:
        - enrollment_confirmation
        - course_syllabus

  feedback:
    required: true
    emailTemplateId: SERV-1-feedback
    surveyUrl: "{UI_BASE_URL}/feedback/{token}"
    deliveryMethod: email
    expiryDays: 7
    questions:
      - id: enrollment_experience
        type: rating
        question: How was your course enrollment experience?
      - id: process_clarity
        type: rating
        question: Was the enrollment process clear and easy to follow?
      - id: improvements
        type: text
        question: How can we improve this service?
