id: SERV-3-04152026
name: Transcript of Records (TOR) Request
description: Request official transcript of academic records from the Registrar
type: requestTOR
serviceCode: requestTOR
initiator: Student

envelopes:
  request:
    required: true
    parameters:
      studentId: String (e.g., 2020-00123)
      firstName: String
      lastName: String
      email: String (student email for delivery)
      contactNumber: String (for SMS notifications)
      program: String (degree program enrolled)
      numberOfCopies: Number (1-10)
      purpose: String (e.g., Work application, Visa, Higher studies)
      deliveryAddress: String (if requesting physical mail)
      requestDate: String (ISO format, auto-filled)

  approval:
    required: true
    emailTemplateId: SERV-3-approval
    approvers:
      - id: barondimaranan@gmail.com
        role: Registrar (Head Teller)
      - id: baron@fowlstudios.com
        role: Approval Manager (Sub Teller)
    approvalRules:
      type: complex
      requiredApprovers:
        - barondimaranan@gmail.com
      atLeastOneOf:
        - baron@fowlstudios.com
    expiryHours: 24

  payment:
    required: true
    paymentProvider: maya
    charges:
      - item: Transcript of Records (per copy)
        amount: 500
        currency: PHP
        quantity: 1
      - item: Expedited Processing (optional)
        amount: 150
        currency: PHP
        quantity: 0

  processing:
    required: true
    stopOnFailure: true
    tasks:
      - name: verify_student_enrollment
        description: Verify student is/was enrolled in MAPUA
        type: built_in
        builtIn:
          function: verify_student_enrollment
          parameters:
            studentId: "{{studentId}}"
            program: "{{program}}"

      - name: pull_academic_records
        description: Pull complete academic records from system
        type: webhook
        webhook:
          url: https://sis-api.mapua.edu.ph/academic/records
          method: POST
          timeout: 30000
          retries: 3

      - name: generate_tor_document
        description: Generate official TOR document with seal
        type: webhook
        webhook:
          url: https://document-service.mapua.edu.ph/tor/generate
          method: POST
          timeout: 60000
          retries: 2

      - name: validate_tor_content
        description: Validate all entries and grades are accurate
        type: built_in
        builtIn:
          function: validate_tor_content
          parameters:
            documentType: TOR
            includeGrades: true
            verifySeal: true

  delivery:
    required: true
    method: email
    emailTemplateId: SERV-3-delivery
    email:
      subject: Your Transcript of Records - MAPUA
      recipient: "{{email}}"
      attachmentInclude:
        - tor_document
        - processing_receipt

  feedback:
    required: true
    emailTemplateId: SERV-3-feedback
    surveyUrl: "{UI_BASE_URL}/feedback/{token}"
    deliveryMethod: email
    expiryDays: 7
    questions:
      - id: overall_satisfaction
        type: rating
        question: How satisfied are you with the TOR request process?
      - id: request_timeliness
        type: rating
        question: Was the TOR delivered within expected timeframe?
      - id: document_accuracy
        type: yes_no
        question: Was the TOR document accurate and complete?
      - id: improvements
        type: text
        question: What could we improve in this service?
